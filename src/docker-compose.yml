version: "3.4"

services:
  # Databases
  catalogdb:
    image: postgres
    container_name: catalogdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data/

  basketdb:
    image: postgres
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/data/

  orderdb:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: orderdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
    restart: always
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_order:/var/opt/mssql

  # NEW: MongoDB for Identity Server
  identitydb:
    image: mongo:5.0
    container_name: identitydb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=IdentityServerDb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_identity:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  # Cache & Message Broker
  distributedcache:
    image: redis:7-alpine
    container_name: distributedcache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  messagebroker:
    image: rabbitmq:3-management-alpine
    container_name: messagebroker
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # NEW: Identity Server 4
  identity.api:
    image: ${DOCKER_REGISTRY-}identityapi
    container_name: identity.api
    build:
      context: .
      dockerfile: Services/Identity/Identity.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - MongoDbSettings__ConnectionString=mongodb://admin:admin123@identitydb:27017/IdentityServerDb?authSource=admin
      - MongoDbSettings__DatabaseName=IdentityServerDb
    depends_on:
      - identitydb
    ports:
      - "6010:8080"
    volumes:
      - identity_logs:/app/logs

  # Microservices
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    container_name: catalog.api
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - IdentitySettings__Authority=http://identity.api:8080
      - IdentitySettings__Audience=catalog.api
    depends_on:
      - catalogdb
      - identity.api
    ports:
      - "6000:8080"

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    container_name: basket.api
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__Redis=distributedcache:6379
      - GrpcSettings__DiscountUrl=http://discount.grpc:8080
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
      - IdentitySettings__Authority=http://identity.api:8080
      - IdentitySettings__Audience=basket.api
    depends_on:
      - basketdb
      - distributedcache
      - discount.grpc
      - messagebroker
      - identity.api
    ports:
      - "6001:8080"

  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    container_name: discount.grpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Data Source=discountdb
      - IdentitySettings__Authority=http://identity.api:8080
      - IdentitySettings__Audience=discount.api
    depends_on:
      - identity.api
    ports:
      - "6002:8080"

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    container_name: ordering.api
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Server=orderdb;Database=OrderDb;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
      - FeatureManagement__OrderFullfilment=false
      - IdentitySettings__Authority=http://identity.api:8080
      - IdentitySettings__Audience=ordering.api
    depends_on:
      - orderdb
      - messagebroker
      - identity.api
    ports:
      - "6003:8080"

  # API Gateway with Authentication
  yarpapigateway:
    image: ${DOCKER_REGISTRY-}yarpapigateway
    container_name: yarpapigateway
    build:
      context: .
      dockerfile: ApiGateways/YarpApiGateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - IdentitySettings__Authority=http://identity.api:8080
      - IdentitySettings__Audience=gateway.api
    depends_on:
      - catalog.api
      - basket.api
      - ordering.api
      - identity.api
    ports:
      - "6004:8080"

  # Web Application with OIDC
  shopping.web:
    image: ${DOCKER_REGISTRY-}shoppingweb
    container_name: shopping.web
    build:
      context: .
      dockerfile: WebApps/Shopping.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiSettings__GatewayAddress=http://yarpapigateway:8080
      - IdentitySettings__Authority=http://localhost:6010
      - IdentitySettings__ClientId=shopping.web
      - IdentitySettings__ClientSecret=""
      - IdentitySettings__Scope=eshop.api openid profile email
    depends_on:
      - yarpapigateway
      - identity.api
    ports:
      - "6005:8080"

  # MongoDB Admin Interface (Optional)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin123
      - ME_CONFIG_MONGODB_SERVER=identitydb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - identitydb
    ports:
      - "8081:8081"

volumes:
  postgres_catalog:
  postgres_basket:
  sqlserver_order:
  mongodb_identity:
  redis_data:
  rabbitmq_data:
  identity_logs:

networks:
  default:
    driver: bridge
